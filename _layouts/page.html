---
layout: default
---
<article class="page{% if page.page_class %} {{ page.page_class }}{% endif %}">
  <header class="page-header">
    {%- if page.eyebrow %}
    <p class="page-header__eyebrow">{{ page.eyebrow }}</p>
    {%- endif %}
    <h1>{{ page.heading | default: page.title }}</h1>
  </header>
  <div class="page-content">
    {{ content | replace_first: '<p>最終更新日', '<p class="page-updated">最終更新日' }}
  </div>
</article>
